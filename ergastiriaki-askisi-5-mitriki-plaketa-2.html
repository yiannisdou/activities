    if (q.type === 'mc') { const O = q.options || []; v.opts = sh(O.map((o, i) => i).filter(i => filled(O[i].t))); v.multi = O.filter(o => o.c && filled(o.t)).length > 1; }
    if (q.type === 'match') { const P = q.pairs || []; v.left = sh(P.map((p, i) => i).filter(i => filled(P[i].l))); v.right = shuf([...new Set(P.map(p => String(p.r || '').trim()).filter(Boolean))]); }
    if (q.type === 'order') { v.items = (q.items || []).filter(filled); let c = v.items.map((x, i) => i); for (let k = 0; k < 10 && c.length > 1; k++) { c = shuf(c); if (c.some((x, i) => x !== i)) break; } v.cur = c; }
    if (q.type === 'fill') {
      v.parts = String(q.gap || '').split(/\[([^\]]*)\]/);

      if (q.bank) v.bank = shuf([...new Set(v.ans.map(a => a[0] || '').concat(String(q.extra || '').split(',').map(x => x.trim())).filter(Boolean))]);

  }
  const opt2 = (type, i, val, html) => `<label class="qz-opt" data-v="${esc(val)}"><input type="${type}" name="qz${i}" value="${esc(val)}"><span>${html}</span></label>`;
  const ordList = v => v.cur.map((k, p) => `<li data-p="${p}"><span class="qz-oi">${fmt(v.items[k])}</span><span class="qz-ob"><button type="button" data-mv="-1" aria-label="Πάνω" ${p === 0 ? 'disabled' : ''}>↑</button><button type="button" data-mv="1" aria-label="Κάτω" ${p === v.cur.length - 1 ? 'disabled' : ''}>↓</button></span></li>`).join('');
  function body(v, i) {
    const q = v.q;
    switch (q.type) {
      case 'tf': return `<div class="qz-tf">${opt2('radio', i, 'true', 'Σωστό')}${opt2('radio', i, 'false', 'Λάθος')}</div>`;
      case 'mc': return (v.multi ? '<p class="qz-hint">Μπορεί να είναι σωστές περισσότερες από μία.</p>' : '') + v.opts.map(j => opt2(v.multi ? 'checkbox' : 'radio', i, j, fmt(q.options[j].t))).join('');
      case 'match': return v.left.map(j => `<div class="qz-m" data-v="${j}"><div class="qz-ml">${fmt(q.pairs[j].l)}</div><select aria-label="Αντιστοίχιση"><option value="">— Επίλεξε —</option>${v.right.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join('')}</select></div>`).join('');
      case 'fill': return `<div class="qz-fill">${v.parts.map((p, k) => {
        if (!(k % 2)) return fmt(p);
        const g = k >> 1, len = Math.max(5, ...v.ans[g].map(a => a.length)) + 2;
        return v.bank ? `<select class="qz-gap" data-g="${g}" aria-label="Κενό ${g + 1}"><option value=""></option>${v.bank.map(w => `<option value="${esc(w)}">${esc(w)}</option>`).join('')}</select>`
          : `<input type="text" class="qz-gap" data-g="${g}" size="${len}" autocomplete="off" spellcheck="false" aria-label="Κενό ${g + 1}">`;
      }).join('')}</div>`;
      case 'order': return `<p class="qz-hint">Βάλε τα στοιχεία στη σωστή σειρά με τα βελάκια.</p><ol class="qz-ord">${ordList(v)}</ol>`;
      case 'num': return `<div class="qz-row"><input type="text" class="qz-in" inputmode="decimal" autocomplete="off" aria-label="Απάντηση"><span>${esc(q.unit || '')}</span></div>`;
      case 'short': return `<input type="text" class="qz-in qz-wide" autocomplete="off" aria-label="Απάντηση">`;
    }
    return '';
  }
  function card(v, i) {
    const q = v.q, p = pts(q);
    return `<section class="qz-card" data-q="${i}"><div class="qz-top"><span class="qz-n">${i + 1}</span><span class="qz-p">${String(p).replace('.', ',')} ${p === 1 ? 'μονάδα' : 'μονάδες'}</span></div>`
      + (filled(q.text) ? `<div class="qz-t">${fmt(q.text)}</div>` : '') + (q.img ? `<img src="${esc(q.img)}" alt="">` : '')
      + `<div class="qz-b">${body(v, i)}</div>` + (S.mode === 'each' ? '<button type="button" class="qz-btn qz-chk">Έλεγχος</button>' : '') + '<div class="qz-fb" hidden></div></section>';
  }
  function start() {
    const nm = root.querySelector('.qz-name input'); if (nm) name = nm.value;
    const qs = Q.questions || [];
    st = (S.shuffleQ ? shuf(qs) : qs.slice()).map(prep); cur = 0;
    const total = st.reduce((a, v) => a + pts(v.q), 0), multi = cards && st.length > 1;
    const tools = (S.themeToggle ? '<button type="button" class="qz-tb qz-theme"></button>' : '') + (S.printBtn ? '<button type="button" class="qz-tb qz-print">⎙ Εκτύπωση / PDF</button>' : '');
    const SP = '<tr><td><div class="qz-sp"></div></td></tr>';
    root.innerHTML = `<table class="qz-pt" role="presentation"><thead>${SP}</thead><tfoot>${SP}</tfoot><tbody><tr><td>` + `<header class="qz-h"><div class="qz-hb">${filled(Q.subject) || filled(Q.grade) ? `<p class="qz-sub">${[Q.subject, Q.grade].filter(filled).map(fmt).join(' · ')}</p>` : ''}<h1>${fmt(Q.title || 'Quiz')}</h1>${filled(Q.intro) ? `<p>${fmt(Q.intro)}</p>` : ''}</div><div class="qz-hr"><p class="qz-meta">${st.length} ${st.length === 1 ? 'ερώτηση' : 'ερωτήσεις'} · ${String(total).replace('.', ',')} μονάδες</p>${tools ? `<div class="qz-tools">${tools}</div>` : ''}</div></header>`
      + `<div class="qz-pinfo">Ονοματεπώνυμο: <span class="qz-pname">………………………………………</span> · Ημερομηνία: ${new Date().toLocaleDateString('el-GR')}</div>`
      + (S.askName ? `<label class="qz-name">Ονοματεπώνυμο <input type="text" class="qz-in" value="${esc(name)}"></label>` : '')
      + (multi ? `<nav class="qz-tabs" aria-label="Ερωτήσεις">${st.map((v, i) => `<button type="button" class="qz-pill" data-go="${i}" aria-label="Ερώτηση ${i + 1}">${i + 1}</button>`).join('')}</nav><div class="qz-prog"><i></i></div>` : '')
      + (st.length ? `<div class="qz-track${multi ? ' qz-hs' : ''}">${st.map(card).join('')}</div>` : '<p class="qz-hint">Δεν υπάρχουν ακόμη ερωτήσεις.</p>')
      + (multi ? '<div class="qz-nav"><button type="button" class="qz-tb" data-step="-1">← Προηγούμενη</button><span class="qz-pos"></span><button type="button" class="qz-tb" data-step="1">Επόμενη →</button></div>' : '')
      + `<div class="qz-foot"><p class="qz-meta qz-un"></p><button type="button" class="qz-btn qz-submit">${S.mode === 'each' ? 'Τελικό αποτέλεσμα' : 'Υποβολή απαντήσεων'}</button></div><div class="qz-res" hidden></div></td></tr></tbody></table>`;
    applyTheme();
    track = multi ? root.querySelector('.qz-track') : null;
    if (ro) { ro.disconnect(); ro = null; }
    if (track) {
      track.addEventListener('scroll', () => { clearTimeout(scT); scT = setTimeout(syncScroll, 90); }, { passive: true });
      try { ro = new ResizeObserver(fitH); [...track.children].forEach(c => ro.observe(c)); } catch (e) { }
      setActive(0);
    }
  }
  function fitH() { if (!track) return; const c = track.children[cur]; if (c) track.style.height = c.offsetHeight + 'px'; }
  function setActive(i) {
    if (!track) return;
    cur = Math.max(0, Math.min(st.length - 1, i));
    const tabs = root.querySelector('.qz-tabs');
    root.querySelectorAll('.qz-pill').forEach((p, k) => { p.classList.toggle('on', k === cur); if (k === cur) p.setAttribute('aria-current', 'step'); else p.removeAttribute('aria-current'); });
    const pill = tabs && tabs.children[cur];
    if (pill) tabs.scrollTo({ left: pill.offsetLeft - tabs.offsetLeft - tabs.clientWidth / 2 + pill.offsetWidth / 2, behavior: 'smooth' });
    root.querySelector('.qz-pos').textContent = `${cur + 1} / ${st.length}`;
    root.querySelector('[data-step="-1"]').disabled = cur === 0;
    const last = cur === st.length - 1, nx = root.querySelector('[data-step="1"]');
    nx.disabled = last; nx.style.visibility = last ? 'hidden' : '';
    const ft = root.querySelector('.qz-foot'); if (ft) ft.hidden = !last;
    fitH(); prog();
  }
  function go(i, smooth) {
    if (!track) return;
    if (Math.abs(i - cur) > 1) smooth = false;
    setActive(i);
    const c = track.children[cur];
    track.scrollTo({ left: c.offsetLeft - track.children[0].offsetLeft, behavior: smooth ? 'smooth' : 'auto' });
  }
  function syncScroll() {
    if (!track) return;
    const x = track.scrollLeft, base = track.children[0].offsetLeft; let best = 0, bd = 1e9;
    [...track.children].forEach((c, k) => { const d = Math.abs(c.offsetLeft - base - x); if (d < bd) { bd = d; best = k; } });
    if (best !== cur) setActive(best);
  }
  function isAnswered(i) {
    const v = st[i], el = root.querySelector(`[data-q="${i}"]`); if (!el) return false;
    if (v.q.type === 'order') return !!v.moved;
    return [...el.querySelectorAll('input')].some(x => x.type === 'radio' || x.type === 'checkbox' ? x.checked : filled(x.value)) || [...el.querySelectorAll('select')].some(s => s.value);
  }
  function prog() {
    const pills = root.querySelectorAll('.qz-pill'); let n = 0;
    st.forEach((v, i) => { const a = v.done || isAnswered(i); if (a) n++; if (pills[i]) pills[i].classList.toggle('ans', a); });
    const bar = root.querySelector('.qz-prog i'); if (bar) bar.style.width = (st.length ? n / st.length * 100 : 0) + '%';
    const un = root.querySelector('.qz-un'), left = st.length - n; if (un) un.textContent = left ? `Έχεις ${left} ${left === 1 ? 'αναπάντητη ερώτηση' : 'αναπάντητες ερωτήσεις'}.` : '';
  }
  function markOpts(el, chosen, correct) {
    el.querySelectorAll('.qz-opt').forEach(l => {
      const val = l.dataset.v, c = correct.has(val), ch = chosen.has(val);
      if (ch) l.classList.add(c ? 'ok' : 'bad'); else if (c && S.showAnswers) l.classList.add('miss');
    });
  }
  function rightAnswer(v) {
    const q = v.q;
    switch (q.type) {
      case 'tf': return q.answer ? 'Σωστό' : 'Λάθος';
      case 'mc': return (q.options || []).filter(o => o.c && filled(o.t)).map(o => fmt(o.t)).join(' · ');
      case 'match': return '<ul>' + v.left.map(j => `<li>${fmt(q.pairs[j].l)} → ${esc(q.pairs[j].r)}</li>`).join('') + '</ul>';
      case 'fill': return v.ans.map(a => esc(a[0] || '')).join(', ');
      case 'order': return '<ol>' + v.items.map(s => `<li>${fmt(s)}</li>`).join('') + '</ol>';
      case 'num': return esc(String(q.answer).replace('.', ',')) + ' ' + esc(q.unit || '') + (Number(q.tol) ? ` (±${esc(q.tol)}%)` : '');
      case 'short': return esc((q.answers || []).filter(filled)[0] || '');
    }
    return '';
  }
  function grade(i) {
    const v = st[i]; if (!v || v.done) return;
    const q = v.q, el = root.querySelector(`[data-q="${i}"]`);
    let frac = 0, ans = false;
    if (q.type === 'tf' || q.type === 'mc') {
      const chosen = new Set([...el.querySelectorAll('input:checked')].map(x => x.value));
      const correct = new Set(q.type === 'tf' ? [String(!!q.answer)] : (q.options || []).map((o, j) => o.c && filled(o.t) ? String(j) : null).filter(x => x !== null));
      ans = chosen.size > 0; frac = ans && chosen.size === correct.size && [...chosen].every(x => correct.has(x)) ? 1 : 0;
      markOpts(el, chosen, correct);
    } else if (q.type === 'match') {
      let c = 0; const rows = [...el.querySelectorAll('.qz-m')];
      rows.forEach(r => { const s = r.querySelector('select'), ok = norm(s.value) === norm(q.pairs[+r.dataset.v].r); if (s.value) ans = true; if (ok) c++; r.classList.add(ok ? 'ok' : 'bad'); });
      frac = rows.length ? c / rows.length : 0;
    } else if (q.type === 'fill') {
      let c = 0; const gs = [...el.querySelectorAll('.qz-gap')];
      gs.forEach(g => { const val = g.value, ok = v.ans[+g.dataset.g].some(a => norm(a) === norm(val)); if (filled(val)) ans = true; if (ok) c++; g.classList.add(ok ? 'ok' : 'bad'); });
      frac = gs.length ? c / gs.length : 0;
    } else if (q.type === 'order') {
      ans = !!v.moved; let c = 0;
      el.querySelectorAll('.qz-ord li').forEach(li => { const p = +li.dataset.p, ok = v.cur[p] === p; if (ok) c++; li.classList.add(ok ? 'ok' : 'bad'); });
      frac = v.cur.length ? c / v.cur.length : 0;
    } else {
      const inp = el.querySelector('.qz-in'), val = inp.value; ans = filled(val); let ok = false;
      if (q.type === 'num') { const x = toNum(val), a = toNum(q.answer), tol = Math.abs(toNum(q.tol) || 0); ok = ans && isFinite(x) && isFinite(a) && Math.abs(x - a) <= Math.abs(a) * tol / 100 + 1e-9 * Math.max(1, Math.abs(a)); }
      else ok = ans && (q.answers || []).filter(filled).some(a => norm(a) === norm(val));
      frac = ok ? 1 : 0; inp.classList.add(ok ? 'ok' : 'bad');
    }
    v.done = true; v.frac = Math.round(frac * 100) / 100; v.answered = ans;
    el.querySelectorAll('input,select,.qz-b button').forEach(x => x.disabled = true);
    const ch = el.querySelector('.qz-chk'); if (ch) ch.remove();
    const cls = v.frac >= 1 ? 'ok' : v.frac > 0 ? 'part' : 'bad';
    const label = !ans ? 'Δεν απαντήθηκε' : v.frac >= 1 ? '✓ Σωστό!' : v.frac > 0 ? `Μερικώς σωστό (${Math.round(v.frac * 100)}%)` : '✗ Λάθος';
    const fb = el.querySelector('.qz-fb');
    fb.innerHTML = `<b>${label}</b>` + (S.showAnswers && v.frac < 1 ? `<div>Σωστή απάντηση: ${rightAnswer(v)}</div>` : '') + (filled(q.explain) ? `<div class="qz-ex">${fmt(q.explain)}</div>` : '');
    fb.className = 'qz-fb ' + cls; fb.hidden = false; el.classList.add('qz-' + cls);
    const pill = root.querySelectorAll('.qz-pill')[i]; if (pill) pill.classList.add(cls);
    fitH(); prog();
  }
  function finish() {
    st.forEach((v, i) => grade(i));
    const total = st.reduce((a, v) => a + pts(v.q), 0), score = Math.round(st.reduce((a, v) => a + v.frac * pts(v.q), 0) * 100) / 100;
    const pct = total ? Math.round(score / total * 100) : 0, pass = pct >= Number(S.pass || 0), un = st.filter(v => !v.answered).length;
    const nm = root.querySelector('.qz-name input'); if (nm) { name = nm.value; nm.disabled = true; }
    const res = root.querySelector('.qz-res'), sub = root.querySelector('.qz-submit'); if (sub) sub.remove();
    res.innerHTML = `<div class="qz-score"><b>${String(score).replace('.', ',')}</b> / ${String(total).replace('.', ',')}</div><div class="qz-bar"><i style="width:${pct}%"></i></div>`
      + `<p class="qz-big">${pct}% — ${pass ? 'Μπράβο, πέτυχες τη βάση!' : 'Δεν έφτασες ακόμη τη βάση (' + esc(S.pass) + '%).'}</p>`
      + `<p class="qz-meta">${st.filter(v => v.frac >= 1).length} σωστές από ${st.length}${un ? ` · ${un} αναπάντητες` : ''}${filled(name) ? ' · ' + esc(name) : ''} · ${new Date().toLocaleString('el-GR')}</p>`
      + `<div class="qz-ra">${S.retry ? '<button type="button" class="qz-btn qz-again">Ξανά από την αρχή</button>' : ''}${S.printBtn ? '<button type="button" class="qz-tb qz-print">⎙ Εκτύπωση / PDF αποτελεσμάτων</button>' : ''}</div>`;
    res.className = 'qz-res ' + (pass ? 'ok' : 'bad'); res.hidden = false;
    try { res.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { }
  }
  root.onclick = e => {
    const t = e.target;
    const mv = t.closest('[data-mv]');
    if (mv) { const cd = mv.closest('[data-q]'), v = st[+cd.dataset.q], p = +mv.closest('li').dataset.p, to = p + +mv.dataset.mv; if (v.done || to < 0 || to >= v.cur.length) return; [v.cur[p], v.cur[to]] = [v.cur[to], v.cur[p]]; v.moved = true; cd.querySelector('.qz-ord').innerHTML = ordList(v); const b = cd.querySelector(`li[data-p="${to}"] [data-mv="${mv.dataset.mv}"]`); if (b && !b.disabled) b.focus({ preventScroll: true }); prog(); return; }
    const g = t.closest('[data-go]'); if (g) return go(+g.dataset.go, true);
    const sp = t.closest('[data-step]'); if (sp) return go(cur + +sp.dataset.step, true);
    if (t.closest('.qz-theme')) { theme = isDark() ? 'light' : 'dark'; if (!opt.preview) { try { localStorage.setItem(TK, theme); } catch (x) { } } return applyTheme(); }
    if (t.closest('.qz-print')) { const nm = root.querySelector('.qz-name input'), pn = root.querySelector('.qz-pname'); if (nm && filled(nm.value) && pn) pn.textContent = nm.value; try { window.print(); } catch (x) { } return; }
    if (t.closest('.qz-chk')) return grade(+t.closest('[data-q]').dataset.q);
    if (t.closest('.qz-submit')) return finish();
    if (t.closest('.qz-again')) { start(); try { root.scrollIntoView({ behavior: 'smooth' }); } catch (x) { } }
  };
  root.oninput = root.onchange = e => { if (e.target.closest('[data-q]')) prog(); };
  root.onkeydown = e => {
    if (!track || e.target.closest('input,select,textarea')) return;
    if (e.key === 'ArrowRight') { go(cur + 1, true); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { go(cur - 1, true); e.preventDefault(); }
  };
  if (!opt.preview && window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) { } }
  window.addEventListener('resize', () => { if (track) go(cur, false); });
  start();
  if (opt.embed && window.parent !== window) {
    const post = () => { try { window.parent.postMessage({ qzHeight: Math.ceil(document.documentElement.scrollHeight) }, '*'); } catch (e) { } };
    try { new ResizeObserver(post).observe(document.body); } catch (e) { setInterval(post, 1000); }
    post();
  }
})(document.getElementById('qz'), JSON.parse(document.getElementById('quiz-data').textContent), { embed: true });
</script>
