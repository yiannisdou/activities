<script>
const LIB = (function () {
  /* ---------- IPv4 ---------- */
  const ipToInt = s => {
    const p = String(s == null ? '' : s).trim().split('.');
    if (p.length !== 4) return null;
    let n = 0;
    for (const x of p) { if (!/^\d{1,3}$/.test(x)) return null; const v = +x; if (v > 255) return null; n = n * 256 + v; }
    return n;
  };
  const intToIp = n => [24, 16, 8, 0].map(s => Math.floor(n / 2 ** s) % 256).join('.');
  const maskInt = p => p === 0 ? 0 : 2 ** 32 - 2 ** (32 - p);
  const maskStr = p => intToIp(maskInt(p));
  const prefixFromMask = s => { const n = ipToInt(s); if (n === null) return null; for (let p = 0; p <= 32; p++) if (maskInt(p) === n) return p; return null; };
  const ipClass = n => { const o = Math.floor(n / 2 ** 24); return o < 128 ? 'A' : o < 192 ? 'B' : o < 224 ? 'C' : o < 240 ? 'D' : 'E'; };
